# AI Team - loop autonomo Claude (executor) <-> Codex (reviewer/router).
#
# Roda 100% na nuvem, em runner hospedado do GitHub. Nao depende do PC do
# usuario, de Claude/Codex Desktop, do Revit aberto nem de MCP local.
#
# Como iniciar: Actions -> AI Team -> Run workflow.
#
# Limites (secao 14 do pedido): max_rounds vem da UI mas e' cortado pelo
# teto de `ai_team/config.yaml`; o timeout do job e' o ultimo recurso.
#
# NUNCA faz merge em `main`. O teto do sistema e' READY_FOR_HUMAN_REVIEW.

name: AI Team

on:
  workflow_dispatch:
    inputs:
      task:
        description: "A tarefa. Seja especifico: o que corrigir/investigar e como saber que ficou pronto."
        required: true
        type: string
      mode:
        description: "Modo de operacao"
        required: true
        default: full
        type: choice
        options: [full, diagnose, implement, review, benchmark, selftest]
      max_rounds:
        description: "Maximo de rodadas Claude->Codex (o teto da config prevalece)"
        required: false
        default: "3"
        type: string
      preferred_model:
        description: "Modelo do Claude na RODADA 1 (o Codex pode mudar depois)"
        required: false
        default: ""
        type: choice
        options: ["", claude-haiku-4-5, claude-sonnet-5, claude-opus-5]
      preferred_reasoning:
        description: "Nivel de raciocinio na RODADA 1 (o Codex pode mudar depois)"
        required: false
        default: ""
        type: choice
        options: ["", low, medium, high, xhigh, max]
      branch_name:
        description: "Nome da branch (vazio = ai/<slug-da-tarefa>)"
        required: false
        default: ""
        type: string

permissions:
  contents: write        # criar a branch da tarefa e empurrar os commits
  pull-requests: write   # abrir a PR de revisao humana

# Secao 10 do pedido: nunca dois agentes no mesmo working tree.
concurrency:
  group: ai-team-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ai-team:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # Segredos so' existem aqui, nunca em arquivo do repositorio, e o
      # orquestrador redige qualquer eco deles antes de gravar/logar.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Desliga telemetria/updates que so' adicionam ruido no runner.
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout (historico completo, para diff e branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar entradas
        id: validate
        # Entradas vao por env, NUNCA interpoladas direto no script: um
        # `${{ }}` dentro de `run:` e' substituido antes de o shell existir,
        # entao uma tarefa com aspas e `;` viraria comando.
        env:
          MODE: ${{ inputs.mode }}
          ROUNDS: ${{ inputs.max_rounds }}
        run: |
          set -euo pipefail

          if ! [[ "$ROUNDS" =~ ^[0-9]+$ ]]; then
            echo "::error::max_rounds precisa ser um inteiro (recebido: '$ROUNDS')"
            exit 1
          fi

          # `selftest` roda offline e nao precisa de segredo nenhum. Os
          # demais modos precisam das duas chaves - falhar aqui e' melhor
          # que gastar meia hora de runner para descobrir depois.
          if [ "$MODE" != "selftest" ]; then
            MISSING=""
            [ -z "${ANTHROPIC_API_KEY:-}" ] && MISSING="$MISSING ANTHROPIC_API_KEY"
            [ -z "${OPENAI_API_KEY:-}" ] && MISSING="$MISSING OPENAI_API_KEY"
            if [ -n "$MISSING" ]; then
              echo "::error::secrets ausentes:$MISSING - configure em Settings > Secrets and variables > Actions"
              exit 1
            fi
          fi
          echo "needs_agents=$([ "$MODE" = selftest ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de teste
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Configurar Node
        if: steps.validate.outputs.needs_agents == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar os CLIs dos agentes
        if: steps.validate.outputs.needs_agents == 'true'
        run: |
          set -euo pipefail
          # Versoes fixas: uma mudanca de flag no CLI nao pode quebrar uma
          # run em andamento sem aviso. Suba deliberadamente ao atualizar.
          npm install -g @anthropic-ai/claude-code@2.1.252
          npm install -g @openai/codex@0.151.0
          echo "claude: $(claude --version)"
          echo "codex:  $(codex --version)"

      - name: Identidade do git
        run: |
          set -euo pipefail
          git config user.name "ai-team[bot]"
          git config user.email "ai-team-bot@users.noreply.github.com"

      - name: Registrar o SHA da main antes da run
        id: baseline
        run: echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Rodar o orquestrador
        id: orchestrator
        continue-on-error: true
        env:
          TASK: ${{ inputs.task }}
          MODE: ${{ inputs.mode }}
          ROUNDS: ${{ inputs.max_rounds }}
          PREFERRED_MODEL: ${{ inputs.preferred_model }}
          PREFERRED_REASONING: ${{ inputs.preferred_reasoning }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          set -uo pipefail
          ARGS=(--task "$TASK"
                --mode "$MODE"
                --max-rounds "$ROUNDS"
                --summary-file "$GITHUB_STEP_SUMMARY")

          [ -n "$PREFERRED_MODEL" ] && ARGS+=(--preferred-model "$PREFERRED_MODEL")
          [ -n "$PREFERRED_REASONING" ] && ARGS+=(--preferred-reasoning "$PREFERRED_REASONING")
          [ -n "$BRANCH_NAME" ] && ARGS+=(--branch "$BRANCH_NAME")
          # O selftest e' offline e nao deve criar branch nenhuma.
          [ "$MODE" = "selftest" ] && ARGS+=(--no-branch)

          python -m ai_team "${ARGS[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Ler o resultado final
        id: result
        if: always()
        run: |
          set -uo pipefail
          FINAL="$(ls -d .ai-team/runs/*/final_result.json 2>/dev/null | tail -1 || true)"
          if [ -z "$FINAL" ]; then
            echo "status=ERROR" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            echo "do_not_merge=true" >> "$GITHUB_OUTPUT"
            echo "::warning::nenhum final_result.json - o orquestrador nao chegou ao fim"
            exit 0
          fi
          python - "$FINAL" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"status={d.get('status', 'ERROR')}")
          print(f"branch={d.get('branch', '')}")
          print(f"do_not_merge={str(d.get('do_not_merge', True)).lower()}")
          print(f"rounds={d.get('rounds_used', 0)}")
          print(f"run_id={d.get('run_id', '')}")
          PY

      - name: Verificar que a main nao foi tocada
        if: always()
        env:
          BEFORE: ${{ steps.baseline.outputs.main_sha }}
        run: |
          set -euo pipefail
          # Defesa final: nem o agente nem o orquestrador podem mover a main.
          git fetch origin main --quiet
          AFTER="$(git rev-parse origin/main)"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::origin/main mudou de $BEFORE para $AFTER durante a run"
            exit 1
          fi
          echo "origin/main intocada em $AFTER"

      - name: Empurrar a branch da tarefa
        id: push
        if: >-
          inputs.mode != 'selftest' &&
          steps.result.outputs.branch != '' &&
          steps.result.outputs.status != 'ERROR'
        env:
          BRANCH: ${{ steps.result.outputs.branch }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            main|master) echo "::error::recusando empurrar para $BRANCH"; exit 1 ;;
          esac
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "nenhum commit novo - nada a empurrar"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sem --force: uma run nunca reescreve o que outra deixou.
          for i in 1 2 3 4; do
            if git push -u origin "$BRANCH"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push falhou; nova tentativa em $((2**i))s"
            sleep $((2**i))
          done
          echo "::error::push falhou apos 4 tentativas"
          exit 1

      - name: Abrir a PR de revisao humana
        if: >-
          steps.push.outputs.pushed == 'true' &&
          steps.result.outputs.status == 'READY_FOR_HUMAN_REVIEW'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.result.outputs.branch }}
          TASK: ${{ inputs.task }}
          RUN_ID: ${{ steps.result.outputs.run_id }}
        run: |
          set -euo pipefail
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR ja' existe para $BRANCH"
            exit 0
          fi
          # O corpo sai do resumo ja' redigido pelo orquestrador.
          BODY_FILE="$(mktemp)"
          {
            echo "Gerada automaticamente pelo AI Team (run \`$RUN_ID\`)."
            echo
            cat "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo
            echo "---"
            echo "**O merge continua sendo humano.** O AI Team so' chega a READY_FOR_HUMAN_REVIEW."
          } > "$BODY_FILE"
          gh pr create --base main --head "$BRANCH" \
            --title "AI Team: $TASK" --body-file "$BODY_FILE"

      - name: Guardar o estado da run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-team-run-${{ github.run_id }}
          # Logs detalhados ficam em artifact, nao no git (secao 15 do pedido).
          path: .ai-team/runs/
          retention-days: 30
          if-no-files-found: warn

      - name: Concluir com o status do orquestrador
        if: always()
        env:
          STATUS: ${{ steps.result.outputs.status }}
          BRANCH: ${{ steps.result.outputs.branch }}
        run: |
          set -euo pipefail
          echo "AI Team terminou em: $STATUS"
          case "$STATUS" in
            READY_FOR_HUMAN_REVIEW)
              echo "::notice::Pronto para revisao humana na branch $BRANCH" ;;
            NEEDS_HUMAN|NEEDS_REVIT|MAX_ROUNDS)
              echo "::warning::$STATUS - veja o resumo e os artifacts; o estado foi preservado" ;;
            *)
              echo "::error::$STATUS - DO_NOT_MERGE"
              exit 1 ;;
          esac

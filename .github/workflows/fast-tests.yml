# FAST GATE - a rede de seguranca que faltava.
#
# Ate' 2026-09-16 nenhum workflow deste repositorio executava `pytest`: o
# unico que existia validava documentacao e declara no proprio summary que
# "nao aprova regras, benchmark ou solver". Os ~1.200 testes do motor
# dependiam de alguem lembrar de roda-los na mao.
#
# Este portao roda tudo que NAO e' `slow` - o motor headless, os validadores
# red/green, PRISMA, aberturas, CHANNEL, B19, determinismo por invariante e
# as regressoes de travamento de UI. O corpus real (TP1/TGD) fica de fora,
# no portao FULL (`full-tests.yml`), porque cada solve custa dezenas de
# segundos.
#
# `timeout-minutes` aqui e' rede contra travamento, NUNCA um gate de
# desempenho: o portao reprova por teste vermelho, jamais por relogio.
name: Testes rapidos (FAST gate)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**', 'codex/**']

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout da revisao avaliada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A suite nao tem dependencia externa nenhuma: `tests/revit_stubs.py`
      # substitui a API do Revit/WinForms por dubles de stdlib pura.
      - name: Instalar pytest
        run: python -m pip install --disable-pip-version-check --quiet pytest

      - name: FAST gate (pytest -m "not slow")
        run: python -m pytest -m "not slow" -q -p no:cacheprovider --durations=10

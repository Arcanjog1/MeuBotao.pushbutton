name: Checa atualizacao do PROJECT_STATUS.md

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**', 'codex/**']

permissions:
  contents: read

jobs:
  check-status-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout da revisao avaliada
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Testar validacao (casos validos e invalidos)
        run: python3 -m unittest discover -s tools/documentation -p 'test_*.py' -v

      - name: Validar entrega completa e publicar evidencia no summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          EXTRA=()
          if [ "$EVENT_NAME" = "push" ] && [ "$BRANCH_REF" = "refs/heads/main" ]; then
            BASE="$BEFORE_SHA"
          else
            BASE="$(git merge-base origin/main HEAD)"
            EXTRA=(--require-current-main)
          fi
          {
            echo '## Evidencia de governanca documental'
            echo "HEAD avaliado: $HEAD_SHA"
            echo "Base do diff: $BASE"
            echo "Main observada: $MAIN_SHA"
            echo 'Validacao estrutural; nao aprova regras, benchmark ou solver.'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/documentation/validate.py --base "$BASE" --main "$MAIN_SHA" "${EXTRA[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

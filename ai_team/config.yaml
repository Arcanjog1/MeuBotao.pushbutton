# AI Team Cloud - politica do orquestrador.
#
# Este arquivo e' a POLITICA EXPLICITA de roteamento exigida na secao 5 do
# pedido. O Codex recebe esta politica dentro do prompt e precisa justificar
# qualquer mudanca de modelo/raciocinio em `routing_reason`.
#
# Nada que o Codex devolve entra num argv sem passar pelas whitelists abaixo.

version: 1

limits:
  max_rounds: 3              # default; a UI do GitHub pode subir/descer
  max_rounds_ceiling: 8      # teto absoluto - a UI nao consegue passar disso
  timeout_minutes: 90        # relogio de parede da run inteira
  max_claude_calls: 8
  max_codex_calls: 8
  max_budget_usd_per_claude_call: 5.0

claude:
  bin: claude
  allowed_models:
    - claude-haiku-4-5
    - claude-sonnet-5
    - claude-opus-5
  allowed_efforts: [low, medium, high, xhigh, max]
  default_model: claude-sonnet-5
  default_effort: medium
  permission_mode: acceptEdits
  # Defesa em profundidade: o hook PreToolUse ja' bloqueia, isto e' o cinto.
  disallowed_tools:
    - "Bash(git push:*)"
    - "Bash(git reset:*)"
    - "Bash(git clean:*)"
    - "Bash(git merge:*)"
    - "Bash(git rebase:*)"
    - "Bash(gh pr merge:*)"
    - "WebFetch"

codex:
  bin: codex
  allowed_models:
    - gpt-5.6-sol
    - gpt-5.1-codex
    - gpt-5-codex
  # O CLI do Codex NAO valida este valor no cliente (ver ARCHITECTURE.md 1.2).
  # A whitelist aqui e' a unica barreira antes da API.
  allowed_efforts: [minimal, low, medium, high, xhigh]
  default_model: gpt-5.6-sol
  default_effort: medium
  # Effort usado quando a rodada e' critica (gate vermelho / ultima rodada).
  escalated_effort: high
  sandbox: read-only          # Codex e' READ-ONLY, imposto pelo sandbox

# Classes de trabalho -> modelo + effort. E' isto que o Codex escolhe.
routing_policy:
  mechanical:
    description: "Renomear, formatar, ajuste obvio de teste, mudanca mecanica."
    model: claude-haiku-4-5
    effort: low
  standard:
    description: "Implementacao normal, correcao localizada com causa clara."
    model: claude-sonnet-5
    effort: medium
  deep:
    description: "Causa raiz, arquitetura, invariancia, regressao teimosa."
    model: claude-opus-5
    effort: high
  critical:
    description: "Falha de gate que ja' resistiu a uma rodada anterior."
    model: claude-opus-5
    effort: xhigh

gates:
  # pytest e' HARD: vermelho reprova a rodada, doa a quem doer.
  pytest:
    enabled: true
    hard: true
    command: ["python3", "-m", "pytest", "tests/", "-q", "-m", "not slow"]
    timeout_seconds: 1800
  # Invariantes de repositorio: main intocada, branch certa, sem segredo novo.
  repo_invariants:
    enabled: true
    hard: true
    protected_branches: [main, master]
  # Metricas numericas contra baseline (o caso `openings 91/91 -> 89/91`).
  # Quando o arquivo de metricas nao existe, o gate fica `skipped` - nunca
  # inventa um numero.
  metrics:
    enabled: true
    hard: true
    metrics_file: ".ai-team/metrics.json"
    baseline_file: "ai_team/baselines/project_metrics.json"

git:
  branch_prefix: "ai/"
  base_branch: main
  # NUNCA na V1. O teto do sistema e' READY_FOR_HUMAN_REVIEW.
  allow_merge_to_main: false
  allow_force_push: false
